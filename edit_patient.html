<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Patient</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f8f9fa;
        }

        .form-container {
            max-width: 600px;
            margin: 50px auto;
            padding: 30px;
            background-color: #ffffff;
            border-radius: 10px;
            box-shadow: 0px 4px 12px rgba(0, 0, 0, 0.1);
        }

        h2 {
            margin-bottom: 30px;
        }

        .form-label {
            font-weight: 500;
        }

        .btn-primary {
            width: 100%;
        }
    </style>
</head>
<body>

<div class="form-container">
    <h2 class="text-center">Edit Patient</h2>
    <form method="POST">
        <div class="mb-3">
            <label class="form-label">Name:</label>
            <input type="text" class="form-control" name="name" value="{{ patient.name }}" required>
        </div>

        <div class="mb-3">
            <label class="form-label">Date of Birth:</label>
            <input type="date" class="form-control" name="dob" value="{{ patient.dob }}" required>
        </div>

        <div class="mb-3">
            <label class="form-label">Gender:</label>
            <select class="form-select" name="gender" required>
                <option value="Male" {% if patient.gender == 'Male' %}selected{% endif %}>Male</option>
                <option value="Female" {% if patient.gender == 'Female' %}selected{% endif %}>Female</option>
                <option value="Other" {% if patient.gender == 'Other' %}selected{% endif %}>Other</option>
            </select>
        </div>

        <div class="mb-3">
            <label class="form-label">Contact:</label>
            <input type="text" class="form-control" name="contact" value="{{ patient.contact }}" required>
        </div>

        <div class="mb-3">
            <label class="form-label">Doctor:</label>
            <select class="form-select" name="doctor_id">
                <option value="">-- Select Doctor --</option>
                {% for doc in doctors %}
                <option value="{{ doc.id }}" {% if patient.doctor_id == doc.id %}selected{% endif %}>
                    {{ doc.name }} ({{ doc.specialization }})
                </option>
                {% endfor %}
            </select>
        </div>

        <button type="submit" class="btn btn-primary">Update Patient</button>
    </form>

    <div class="mt-3 text-center">
        <a href="{{ url_for('dashboard') }}" class="btn btn-link">Back to Dashboard</a>
    </div>
</div>

</body>
</html>
